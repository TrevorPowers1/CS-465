<div class="container mt-4">
  <h2>Travlr Getaways Trips</h2>

  <app-add-trip
    *ngIf="isLoggedIn() && !selectedTrip"
    (tripAdded)="onTripAdded()">
  </app-add-trip>

  <app-edit-trip
    *ngIf="isLoggedIn() && selectedTrip"
    [trip]="selectedTrip"
    (tripUpdated)="onTripUpdated()"
    (cancelEdit)="onCancelEdit()">
  </app-edit-trip>

  <div *ngIf="trips$ | async as trips">
    <div class="row">
      <div class="col-md-4 mb-4" *ngFor="let trip of trips">
        <app-trip-card
          [trip]="trip"
          (editTrip)="onEditTrip($event)">
        </app-trip-card>
      </div>
    </div>
  </div>
</div>
